name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite-exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Docker build
        run: docker compose build
      - name: Run topsic-contest010-4
        run: docker compose run --rm app topsic-contest010-4

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
