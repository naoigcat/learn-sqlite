name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite-exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker compose build
      - name: Run topsic-contest010-4
        run: docker compose run --rm app topsic-contest010-4

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
