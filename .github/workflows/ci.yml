name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite-exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Docker build
        run: docker compose build
      - name: Run topsic-contest010-4
        run: docker compose run --rm app topsic-contest010-4

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
